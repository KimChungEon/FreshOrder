services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: freshorder-web:latest
    container_name: freshorder-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    image: freshorder-admin:latest
    container_name: freshorder-admin
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: freshorder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - admin

networks:
  default:
    name: freshorder-network

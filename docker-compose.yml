services:
  db:
    image: postgres:16-alpine
    container_name: freshorder-db
    restart: unless-stopped
    # 호스트의 Prisma Studio · DBeaver · pgAdmin 등 외부 GUI 접속용
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-freshorder}
      POSTGRES_USER: ${DB_USER:-freshorder}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-freshorder} -d ${DB_NAME:-freshorder}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freshorder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: freshorder-api:2.0
    container_name: freshorder-api
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${DB_USER:-freshorder}:${DB_PASSWORD}@db:5432/${DB_NAME:-freshorder}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # nginx 동일 origin → /api 로 호출 (브라우저는 nginx, SSR도 동일 경로)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    image: freshorder-web:2.0
    container_name: freshorder-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_started

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: freshorder-admin:latest
    container_name: freshorder-admin
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: freshorder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_started
      admin:
        condition: service_started
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: freshorder-network

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;
    client_max_body_size 20m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    upstream freshorder_web {
        server web:3000;
    }

    upstream freshorder_admin {
        server admin:80;
    }

    map $sent_http_content_type $cache_immutable {
        default                   "";
        ~*application/javascript  "public, max-age=31536000, immutable";
        ~*text/css                "public, max-age=31536000, immutable";
        ~*image/                  "public, max-age=31536000, immutable";
        ~*font/                   "public, max-age=31536000, immutable";
    }

    server {
        listen 80 default_server;
        server_name _;

        # Admin SPA: strip the /admin prefix and forward to the admin container
        # (which serves dist/ from root). The trailing slash on proxy_pass is
        # what performs the prefix-stripping rewrite.
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://freshorder_admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /admin;

            # Pass through immutable cache headers from upstream for hashed assets
            add_header Cache-Control $cache_immutable always;
        }

        # Owner web (Next.js): everything else
        location / {
            proxy_pass http://freshorder_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js static chunks: long cache
        location /_next/static/ {
            proxy_pass http://freshorder_web;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
